# Pubblica il gioco su GitHub Pages a ogni push su main.
# Richiede Settings -> Pages -> Source: "GitHub Actions".
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # versioni per Node 24: con le vecchie (configure-pages@v5, upload-pages-artifact@v4,
      # deploy-pages@v4) GitHub forza Node 24 e deploy-pages non trova piu' l'artifact
      # caricato ("No artifacts named github-pages were found")
      - uses: actions/configure-pages@v6
      # pubblica la radice del repo (.git e .github vengono esclusi in automatico)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
