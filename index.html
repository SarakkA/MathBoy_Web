<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="icon" href="assets/sprites/favicon.png">
  <title>MathBoy (web)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* il gioco occupa solo l'area davvero visibile. Con 100vh, sui telefoni (Safari e i
       browser interni di WhatsApp, Instagram, ...) l'altezza comprende anche lo spazio
       sotto le barre del browser: il fondo del gioco (es. il bottone OK della scelta del
       personaggio) finiva coperto e, senza scroll, non si poteva toccare.
       fixed + bordi a 0 segue l'area visibile; env() tiene il gioco fuori dal notch */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }
    canvas { cursor: none; display: block; }
    /* telefono: niente zoom, scroll, selezione o menu del tocco lungo sul gioco */
    #game, canvas { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10; background: #111; color: #fff;
      font: 20px sans-serif; align-items: center; justify-content: center; text-align: center;
    }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* campo del nome invisibile: serve solo a far comparire la tastiera del telefono.
       font-size 16px evita lo zoom automatico di iOS sul focus */
    #name-input {
      position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0;
      border: 0; padding: 0; font-size: 16px; pointer-events: none;
    }
    #old-browser { color: #fff; font: 16px sans-serif; padding: 2em; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate">Ruota il telefono</div>
  <input id="name-input" type="text" maxlength="12" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" enterkeyhint="done" aria-label="Nome">
  <!-- Phaser copiato nel repo: niente CDN, che le reti scolastiche spesso bloccano -->
  <script src="lib/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script nomodule>
    document.getElementById("game").innerHTML =
      '<p id="old-browser">Browser troppo vecchio: serve Chrome, Edge o Firefox aggiornato.</p>';
  </script>
</body>
</html>
